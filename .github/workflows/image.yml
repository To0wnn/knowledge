# The server image on GHCR (ghcr.io/to0wnn/knowledge), for compose.yaml in the repo root and the MCP registry
# (server.json). Built on every published release; the forge installation still builds its own (deploy.sh).
name: image
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  check:
    # No image without a passing project check: the green check.yml run of this very commit, or else the check right here.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Did this commit pass already?
        id: green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On an HTTP error gh prints the error body too: anything but a number means "not known green", so run the check.
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=1" --jq .total_count 2>/dev/null) || n=0
          case "$n" in ''|*[!0-9]*) n=0 ;; esac
          echo "$n green check run(s) for $GITHUB_SHA"
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.green.outputs.count == '0'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.green.outputs.count == '0'
        with:
          python-version: "3.14"  # as in the image and check.yml
      - name: Git identity for the tests that commit
        if: steps.green.outputs.count == '0'
        run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: ./check.sh
        if: steps.green.outputs.count == '0'
  image:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Bundle the plugin skills (deploy.sh does the same before a build)
        run: cp -rL plugin/skills server/plugin_skills
      - name: Version from the release tag (v0.9.28 -> 0.9.28), by hand from the plugin manifest
        id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "version=${TAG:-v$(python3 -c 'import json;print(json.load(open("plugin/.claude-plugin/plugin.json"))["version"])')}" | sed 's/=v/=/' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: server
          push: true
          tags: ghcr.io/to0wnn/knowledge:${{ steps.v.outputs.version }},ghcr.io/to0wnn/knowledge:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
  # The registry entry follows the image without a device-code login: GitHub OIDC proves the run is this repo.
  registry:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
      VERSION: ${{ needs.image.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Version and image tag in server.json from the release
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[0].identifier = "ghcr.io/to0wnn/knowledge:\($v)"' server.json > s.tmp
          mv s.tmp server.json
          grep -n "$VERSION" server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
