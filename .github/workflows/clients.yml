# The client side on every OS a device or guest uses: plugin hooks through Git Bash on Windows, knowledge-agent.py
# for agy/Codex through PowerShell and cmd, the offline copy, and the real Claude Code and Codex CLIs.
# tests/clients_e2e.py starts the real server on the runner itself. It only talks to the server's APIs, never to its
# web UI files, so a push of only those has nothing to test here (check.yml runs for it). That push starts no run
# at all, so it cannot cancel a run of an earlier commit. A release bumps the plugin version, which always runs this.
name: clients
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE"
      - "local.env.example"
      - "docs/**"
      - "server/static/**"
      - "tests/ui_*"
  pull_request:
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE"
      - "local.env.example"
      - "docs/**"
      - "server/static/**"
      - "tests/ui_*"
  workflow_dispatch:
# On a branch a newer push replaces a run in progress. On main a run always finishes (a newer push waits; only the
# queued one is replaced): sessions deploy minutes apart, and cancelling there left main unproven (9 Nov 2026: 27 of
# 44 clients runs on main cancelled, 7 green).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  py39:
    # macOS's own /usr/bin/python3 is 3.9: the plugin and knowledge-agent.py must import and pass their self-tests there
    # (an `X | None` annotation without the __future__ import once broke `import chat`).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; setup-python has no 3.9 for this runner's Ubuntu; uv fetches a standalone build
      - name: Git identity for the tests that commit
        run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: Self-tests under Python 3.9
        working-directory: server
        run: |
          uv python install 3.9
          py=$(uv python find 3.9); "$py" --version
          for t in limits secret-guard companion workers chat watch tools admin; do "$py" "../plugin/hooks/$t.py" --self-test; done
          "$py" ../clients/knowledge-agent.py --selftest
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"  # as in the image: onnxruntime has no wheels for 3.15 yet
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7; tests/clients_e2e.py starts the agy plugin's MCP command the way Go (agy) does
        with:
          go-version: "1.x"  # the runner's own Go; "stable" downloads the newest for 20 s and the test needs no particular version
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Real CLIs
        run: npm install -g @anthropic-ai/claude-code @openai/codex
      - name: Server dependencies
        run: uv sync --project server --frozen --no-dev
      - name: Plugin self-tests on this OS
        shell: bash  # the same line on Windows, macOS and Linux (Windows: file locks, CRLF, process groups differ)
        run: |
          for t in plugin/hooks/chat.py plugin/hooks/companion.py plugin/hooks/workers.py plugin/hooks/tools.py plugin/hooks/admin.py; do uv run --project server --frozen python "$t" --self-test; done
          uv run --project server --frozen python clients/knowledge-agent.py --selftest
      - name: Client end-to-end
        run: uv run --project server --frozen python tests/clients_e2e.py
