# The client side on every OS a device or guest uses: plugin hooks through Git Bash on Windows, knowledge-agent.py
# for agy/Codex through PowerShell and cmd, the offline copy, and the real Claude Code and Codex CLIs.
# tests/clients_e2e.py starts the real server on the runner itself.
name: clients
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    # The project check (./check.sh: hook self-tests, graph, lint, server tests), as before a commit or deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Git identity for the tests that commit
        run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: ./check.sh
  py39:
    # macOS's own /usr/bin/python3 is 3.9: the plugin and knowledge-agent.py must import and pass their self-tests there
    # (an `X | None` annotation without the __future__ import once broke `import chat`).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Git identity for the tests that commit
        run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: Self-tests under Python 3.9
        working-directory: server
        run: |
          python3 --version
          for t in limits secret-guard companion workers chat watch; do python3 "../plugin/hooks/$t.py" --self-test; done
          python3 ../clients/knowledge-agent.py --selftest
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"  # as on the VM and in the image: onnxruntime has no wheels for newer yet
      - uses: actions/setup-go@v5  # tests/clients_e2e.py starts the agy plugin's MCP command the way Go (agy) does
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Real CLIs
        run: npm install -g @anthropic-ai/claude-code @openai/codex
      - name: Server dependencies
        run: uv sync --project server --frozen --no-dev
      - name: Plugin self-tests on this OS
        shell: bash  # the same line on Windows, macOS and Linux (Windows: file locks, CRLF, process groups differ)
        run: |
          for t in plugin/hooks/chat.py plugin/hooks/companion.py plugin/hooks/workers.py; do uv run --project server --frozen python "$t" --self-test; done
          uv run --project server --frozen python clients/knowledge-agent.py --selftest
      - name: Client end-to-end
        run: uv run --project server --frozen python tests/clients_e2e.py
  ui-smoke:
    # tests/ui_ci.py starts a throwaway server on the demo notes, seeds a project, token, pc, chat and task line,
    # and runs tests/ui_smoke.py against it with Playwright's Chromium; any FAIL line exits non-zero.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Server dependencies
        run: uv sync --project server --frozen --no-dev
      - name: Playwright Chromium
        run: uv run --project server --frozen --with playwright python -m playwright install --with-deps chromium
      - name: UI smoke test
        env:
          KNOWLEDGE_SMOKE_SHOTS: ${{ runner.temp }}/shots
        run: |
          mkdir -p "$KNOWLEDGE_SMOKE_SHOTS"
          uv run --project server --frozen --with playwright python tests/ui_ci.py 2>&1 | tee "$KNOWLEDGE_SMOKE_SHOTS/ui_smoke.log"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-smoke
          path: ${{ runner.temp }}/shots
