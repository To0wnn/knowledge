# Everything here is pinned to an exact version or digest; this proposes the bumps. A proposal goes through the check and
# the client test, and is merged by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups: {actions: {patterns: ["*"]}}
  - package-ecosystem: docker
    directory: /server
    schedule: {interval: weekly}
    ignore:
      # Python 3.15 waits for onnxruntime wheels
      - dependency-name: python
        versions: [">=3.15"]
  - package-ecosystem: uv
    directory: /server
    schedule: {interval: weekly}
    groups: {python: {patterns: ["*"]}}
