# The knowledge server on one machine, with all notes in ./data (no NFS, no reverse proxy needed).
#   mkdir data && echo "KNOWLEDGE_UI_PASSWORD=<a long password>" > .env && docker compose up -d
# The first start prints one admin token: `docker compose logs knowledge`. More tokens: http://localhost:8766/ui/admin.
# This installation's own setup (NFS from a VM, zero-downtime switch) is server/compose.yaml.
services:
  knowledge:
    image: ghcr.io/to0wnn/knowledge:latest
    container_name: knowledge
    restart: unless-stopped
    user: "${KNOWLEDGE_UID:-1000}:${KNOWLEDGE_GID:-1000}"  # the owner of ./data
    ports: ["${KNOWLEDGE_PORT:-8766}:8766"]
    mem_limit: 3g  # the embedding model uses ~1 GB
    cap_drop: [ALL]  # it runs as a plain user and needs no kernel privilege
    security_opt: ["no-new-privileges:true"]
    environment:
      KNOWLEDGE_UI_PASSWORD: ${KNOWLEDGE_UI_PASSWORD:?set KNOWLEDGE_UI_PASSWORD in .env}
      KNOWLEDGE_ALLOWED_HOSTS: ${KNOWLEDGE_ALLOWED_HOSTS:-localhost:8766,127.0.0.1:8766}  # host:port the clients use
      KNOWLEDGE_PUBLIC_URL: ${KNOWLEDGE_PUBLIC_URL:-}  # e.g. https://knowledge.example.com: named in the agents' instructions
      KNOWLEDGE_LANGUAGE: ${KNOWLEDGE_LANGUAGE:-en}  # en or nl: memo section names and the words the server writes
      TZ: ${TZ:-UTC}  # dates in source file names and the audit log
      KNOWLEDGE_MEMORY: /data/memory  # memos of the first project, with their MEMORY.md index
      KNOWLEDGE_HOMELAB: /data/docs  # its docs
      KNOWLEDGE_CLAUDE: /data/shared  # CLAUDE.md, house_rules.md and skills/ shared with every agent
      # More projects: make them on the admin page (they live in /data/projects).
      KNOWLEDGE_PROJECTS_DIR: /data/projects
      KNOWLEDGE_ADMIN_DIR: /data/admin
      KNOWLEDGE_TOKENS: /data/admin/tokens.json
      KNOWLEDGE_SECRETS: /data/admin/secrets.json
      KNOWLEDGE_AUDIT: /data/state/audit.log
      KNOWLEDGE_VECTORS: /data/state/vectors.npz
      KNOWLEDGE_UI_USER: ${KNOWLEDGE_UI_USER:-admin}  # the name of the password sign-in
      # Optional: sign in through a reverse proxy with forward auth instead (docs/server.md, Settings in .env).
      KNOWLEDGE_PROXY_SECRET: ${KNOWLEDGE_PROXY_SECRET:-}
      KNOWLEDGE_PROXY_USER_HEADER: ${KNOWLEDGE_PROXY_USER_HEADER:-X-Authentik-Username}  # or Remote-User, X-Forwarded-User, ...
      KNOWLEDGE_ADMINS: ${KNOWLEDGE_ADMINS:-}
      KNOWLEDGE_PROXY_IPS: ${KNOWLEDGE_PROXY_IPS:-127.0.0.1}
      # Optional: notices to one Matrix room (all three needed).
      KNOWLEDGE_MATRIX_URL: ${KNOWLEDGE_MATRIX_URL:-}
      KNOWLEDGE_MATRIX_ROOM: ${KNOWLEDGE_MATRIX_ROOM:-}
      KNOWLEDGE_MATRIX_TOKEN: ${KNOWLEDGE_MATRIX_TOKEN:-}
      KNOWLEDGE_NTFY_URL: ${KNOWLEDGE_NTFY_URL:-}
      KNOWLEDGE_NTFY_TOKEN: ${KNOWLEDGE_NTFY_TOKEN:-}
      KNOWLEDGE_TOOLS_MEMO: ${KNOWLEDGE_TOOLS_MEMO:-}
      KNOWLEDGE_TOOLS_DRAFTER: ${KNOWLEDGE_TOOLS_DRAFTER:-Claude}
      KNOWLEDGE_GITHUB_TOKEN: ${KNOWLEDGE_GITHUB_TOKEN:-}
      # Optional: speak chat messages (docs/voice.md). Any OpenAI-compatible speech-to-text server: the "voice" profile
      # below (docker compose --profile voice up -d, then KNOWLEDGE_STT_URL=http://voice:8000/v1), one you run already,
      # or OpenAI (https://api.openai.com/v1 with KNOWLEDGE_STT_KEY; then the audio leaves your network).
      KNOWLEDGE_STT_URL: ${KNOWLEDGE_STT_URL:-}
      KNOWLEDGE_STT_MODEL: ${KNOWLEDGE_STT_MODEL:-whisper-1}  # the model name, for a server that needs one (whisper.cpp ignores it)
      KNOWLEDGE_STT_LANGUAGE: ${KNOWLEDGE_STT_LANGUAGE:-}  # e.g. en or nl; empty = detect (slower)
      KNOWLEDGE_STT_PROMPT: ${KNOWLEDGE_STT_PROMPT:-}  # names and terms it should spell right, comma-separated
      KNOWLEDGE_STT_KEY: ${KNOWLEDGE_STT_KEY:-}
      # Optional: duplicate check with a reranker model folder under ./data (server/export_reranker.sh), e.g. /data/models/reranker.
      KNOWLEDGE_RERANK_MODEL: ${KNOWLEDGE_RERANK_MODEL:-}
    volumes:
      - ./data:/data

  # Optional speech to text for the chat microphone, on the CPU (whisper.cpp's server behind the OpenAI path).
  # Started only with `--profile voice`; the model is fetched on first start into ./data/voice (small: ~470 MB,
  # ~1 GB RAM, a sentence in ~2.5 s on 8 cores). Others: tiny, base, medium, large-v3-turbo (best, slower on a CPU).
  voice:
    image: ghcr.io/ggml-org/whisper.cpp:main-d1be6fde11ac6e0407606b4e42fe72d34add8037  # release v1.9.5 (docs/voice.md: updating it)
    profiles: [voice]
    container_name: knowledge-voice
    restart: unless-stopped
    environment:
      MODEL: ${KNOWLEDGE_VOICE_MODEL:-small}
    command: ['f=/models/ggml-$$MODEL.bin; [ -s $$f ] || ./models/download-ggml-model.sh $$MODEL /models &&
      exec whisper-server -m $$f --host 0.0.0.0 --port 8000 --inference-path /v1/audio/transcriptions --convert']
    volumes:
      - ./data/voice:/models
