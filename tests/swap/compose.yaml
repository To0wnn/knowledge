# Test double of server/compose.yaml for tests/swap/run.sh: the same host-network handover, fake servers.
x-server: &server
  image: python:3.13.16-slim-trixie
  command: ["python", "-u", "/app/fake_server.py"]
  network_mode: host
  stop_grace_period: 10s
  volumes:
    - ./fake_server.py:/app/fake_server.py:ro
    - ./state:/state
services:
  knowledge:
    <<: *server
    container_name: kswap
    environment: {KNOWLEDGE_INSTANCE: blue}
  knowledge-green:
    <<: *server
    container_name: kswap-green
    profiles: [deploy]
    environment: {KNOWLEDGE_INSTANCE: green}
