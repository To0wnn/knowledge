# Front door of the knowledge stack (../compose.yaml): :8766 -> blue, green only while blue is not ready.
# A server counts as ready when /health?ready=1 answers 200: index and semantic index loaded, not drained by deploy.sh.
global
    log stdout format raw local0 warning

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 3s
    timeout client 1h      # the web UI keeps a live stream (SSE) open
    timeout server 1h
    timeout tunnel 1h
    retries 3
    option redispatch

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 2s           # a recreated container gets a new address

frontend knowledge
    bind :8766
    default_backend servers

backend servers
    option httpchk
    http-check send meth GET uri /health?ready=1 ver HTTP/1.1 hdr Host 127.0.0.1:8766
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server blue knowledge:8766 check
    server green knowledge-green:8766 check backup
