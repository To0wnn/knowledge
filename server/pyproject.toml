[project]
name = "kennis-server"
version = "0.1.0"
description = "Live shared access to the homelab docs and Claude memory over MCP (streamable HTTP)"
requires-python = ">=3.13"
dependencies = [
    "mcp==2.3.0",
    "uvicorn==0.54.0",
    "uvloop==0.23.0",  # C event loop, picked up by uvicorn automatically
    "httptools==0.9.0",  # C HTTP parser, picked up by uvicorn automatically
]

[tool.uv]
package = false
