[project]
name = "knowledge-server"
version = "0.1.0"
description = "Live shared access to the homelab docs and Claude memory over MCP (streamable HTTP)"
requires-python = ">=3.13"
dependencies = [
    "mcp==2.3.0",
    "uvicorn==0.54.0",
    "uvloop==0.23.0; sys_platform != 'win32'",  # C event loop, picked up by uvicorn automatically (none for Windows: the client tests run the server there)
    "httptools==0.9.0",  # C HTTP parser, picked up by uvicorn automatically
    "trafilatura==2.3.1",  # ingest: main text of web pages as markdown (Apache-2.0)
    "pypdf==6.21.1",  # ingest: PDF text (BSD-3)
    "python-docx==1.2.0",  # ingest: Word documents (MIT)
    "networkx==3.7",  # graph: Louvain communities, Adamic-Adar (BSD-3)
    "fastembed==0.9.0",  # semantic search: local ONNX embeddings, no torch (Apache-2.0)
    "regex==2026.9.29",
]

[tool.uv]
package = false
