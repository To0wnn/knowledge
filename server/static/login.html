<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge — sign in</title>
<link rel="stylesheet" href="/ui/static/app.css">
</head>
<body class="login">
<main class="login-card">
  <h1>Knowledge</h1>
  <p class="muted">Enter your device token. The browser stays signed in for a year on this device.</p>
  <form method="post" action="/ui/login">
    <label for="token">Device token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign in</button>
  </form>
  <p class="error" id="bad" hidden>That token is not valid. Create one on the VM with <code>~/knowledge/token.py add &lt;device&gt;</code>.</p>
</main>
<script>if (location.search.includes("bad=1")) document.getElementById("bad").hidden = false;</script>
</body>
</html>
