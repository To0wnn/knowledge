# Dockhand stack "knowledge" on forge. Option A: the shared files stay on the VM (${KNOWLEDGE_VM_HOST}) and are
# NFS-mounted into the container; the server only ever sees these trees. Option B (later): point the volumes
# at local paths on forge instead (see README).
# actimeo=1: NFS attribute cache at most 1 s, so edits made natively on the VM show up live (default is up to 60 s).
services:
  knowledge:
    build: .
    image: knowledge-server:local
    # Local image: tells `docker compose pull` (Ansible docker_update) to skip it instead of failing on
    # "pull access denied"; `up` builds from the pinned Dockerfile/uv.lock (cached layers, deterministic).
    pull_policy: build
    container_name: knowledge
    restart: always
    # Hard cap: the embedding model uses ~1 GB; a runaway can never squeeze the other forge services (measured 18 Oct).
    mem_limit: 3g
    ports:
      - "8766:8766"
    environment:
      KNOWLEDGE_MEMORY: /data/memory
      KNOWLEDGE_HOMELAB: /data/homelab
      KNOWLEDGE_CLAUDE: /data/claude
      KNOWLEDGE_ANPITEK: /data/anpitek
      KNOWLEDGE_ANPITEK_MEMORY: /data/anpitek-memory
      KNOWLEDGE_TRADE: /data/trade
      KNOWLEDGE_TRADE_MEMORY: /data/trade-memory
      KNOWLEDGE_ADMIN_DIR: /admin  # tokens.json, users.json, projects.json: managed in the web UI (admin page)
      KNOWLEDGE_TOKENS: /admin/tokens.json
      KNOWLEDGE_PROJECTS_DIR: /projects  # projects created in the web UI
      KNOWLEDGE_ADMINS: admin  # Authentik usernames with full access; everyone else gets projects in the admin page
      KNOWLEDGE_SECRETS: /config/secrets.json  # SHA-256 of known secrets (token.py push-secrets), for redaction
      KNOWLEDGE_AUDIT: /state/audit.log
      KNOWLEDGE_VECTORS: /state/vectors.npz  # embedding cache: a restart only embeds new text
      TZ: Europe/Amsterdam  # local dates in source file names, LOG.md and the audit log (forge itself runs UTC)
      KNOWLEDGE_ALLOWED_HOSTS: ${KNOWLEDGE_ALLOWED_HOSTS}
      KNOWLEDGE_PROXY_IPS: ${KNOWLEDGE_PROXY_IPS}
      # A new project or token made by a person (not an admin) is reported here; the bot token is in proxy.env.
      KNOWLEDGE_MATRIX_URL: ${KNOWLEDGE_MATRIX_URL}
      KNOWLEDGE_MATRIX_ROOM: ${KNOWLEDGE_MATRIX_ROOM}
    # KNOWLEDGE_PROXY_SECRET (Vaultwarden KNOWLEDGE_PROXY_SECRET): Traefik sends it with the Authentik user header.
    # KNOWLEDGE_MATRIX_TOKEN (Vaultwarden MATRIX_BOT_TOKEN): the bot that posts to KNOWLEDGE_MATRIX_ROOM.
    env_file: /root/docker/knowledge/config/proxy.env
    volumes:
      - memory:/data/memory
      - homelab:/data/homelab
      - claude:/data/claude
      - claude_skills:/data/claude/skills
      - claude_agents:/data/claude/agents
      - anpitek:/data/anpitek
      - anpitek_memory:/data/anpitek-memory
      - trade:/data/trade
      - trade_memory:/data/trade-memory
      - /root/docker/knowledge/config:/config:ro
      - /root/docker/knowledge/state:/state
      - /root/docker/knowledge/admin:/admin
      - /root/docker/knowledge/projects:/projects

x-nfs: &nfs
  driver: local
volumes:
  memory:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=${KNOWLEDGE_VM_HOST},nfsvers=4.2,rw,hard,timeo=50,actimeo=1", device: ":/home/user/.claude/projects/-home-user-homelab/memory"}
  homelab:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=${KNOWLEDGE_VM_HOST},nfsvers=4.2,rw,hard,timeo=50,actimeo=1", device: ":/home/user/homelab"}
  claude:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=${KNOWLEDGE_VM_HOST},nfsvers=4.2,ro,hard,timeo=50,actimeo=1", device: ":/home/user/.claude/gedeeld"}
  claude_skills:  # rw since 23 Oct 2026: the admin's own devices write shared skills (server.py write_refusal)
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=${KNOWLEDGE_VM_HOST},nfsvers=4.2,rw,hard,timeo=50,actimeo=1", device: ":/home/user/.claude/skills"}
  claude_agents:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=${KNOWLEDGE_VM_HOST},nfsvers=4.2,ro,hard,timeo=50,actimeo=1", device: ":/home/user/.claude/agents"}
  anpitek:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=${KNOWLEDGE_VM_HOST},nfsvers=4.2,rw,hard,timeo=50,actimeo=1", device: ":/home/user/anpitek"}
  anpitek_memory:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=${KNOWLEDGE_VM_HOST},nfsvers=4.2,rw,hard,timeo=50,actimeo=1", device: ":/home/user/.claude/projects/-home-user-anpitek/memory"}
  trade:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=${KNOWLEDGE_VM_HOST},nfsvers=4.2,rw,hard,timeo=50,actimeo=1", device: ":/home/user/trade_bot"}
  trade_memory:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=${KNOWLEDGE_VM_HOST},nfsvers=4.2,rw,hard,timeo=50,actimeo=1", device: ":/home/user/.claude/projects/-home-user-trade-bot/memory"}
