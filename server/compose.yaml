# Dockhand stack "knowledge" on forge (CT 101). Option A: the shared files stay on the VM (<lan-ip>) and are
# NFS-mounted into the container; the server only ever sees these trees. Option B (later): point the volumes
# at local paths on forge instead (see README).
# actimeo=1: NFS attribute cache at most 1 s, so edits made natively on the VM show up live (default is up to 60 s).
services:
  knowledge:
    build: .
    image: knowledge-server:local
    # Local image: tells `docker compose pull` (Ansible docker_update) to skip it instead of failing on
    # "pull access denied"; `up` builds from the pinned Dockerfile/uv.lock (cached layers, deterministic).
    pull_policy: build
    container_name: knowledge
    restart: always
    # Hard cap: the embedding model uses ~1 GB; a runaway can never squeeze the other forge services (measured 18 Oct).
    mem_limit: 3g
    ports:
      - "8766:8766"
    environment:
      KNOWLEDGE_MEMORY: /data/memory
      KNOWLEDGE_HOMELAB: /data/homelab
      KNOWLEDGE_CLAUDE: /data/claude
      KNOWLEDGE_ANPITEK: /data/anpitek
      KNOWLEDGE_ANPITEK_MEMORY: /data/anpitek-memory
      KNOWLEDGE_TRADE: /data/trade
      KNOWLEDGE_TRADE_MEMORY: /data/trade-memory
      KNOWLEDGE_TOKENS: /config/tokens.json
      KNOWLEDGE_AUDIT: /state/audit.log
      KNOWLEDGE_VECTORS: /state/vectors.npz  # embedding cache: a restart only embeds new text
      TZ: Europe/Amsterdam  # local dates in source file names, LOG.md and the audit log (forge itself runs UTC)
      KNOWLEDGE_ALLOWED_HOSTS: knowledge.to0wnn.com,<lan-ip>:8766,127.0.0.1:8766
    volumes:
      - memory:/data/memory
      - homelab:/data/homelab
      - claude:/data/claude
      - claude_skills:/data/claude/skills
      - claude_agents:/data/claude/agents
      - anpitek:/data/anpitek
      - anpitek_memory:/data/anpitek-memory
      - trade:/data/trade
      - trade_memory:/data/trade-memory
      - /root/docker/knowledge/config:/config:ro
      - /root/docker/knowledge/state:/state

x-nfs: &nfs
  driver: local
volumes:
  memory:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=<lan-ip>,nfsvers=4.2,rw,hard,timeo=50,actimeo=1", device: ":/home/user/.claude/projects/-home-user-homelab/memory"}
  homelab:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=<lan-ip>,nfsvers=4.2,rw,hard,timeo=50,actimeo=1", device: ":/home/user/homelab"}
  claude:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=<lan-ip>,nfsvers=4.2,ro,hard,timeo=50,actimeo=1", device: ":/home/user/.claude/gedeeld"}
  claude_skills:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=<lan-ip>,nfsvers=4.2,ro,hard,timeo=50,actimeo=1", device: ":/home/user/.claude/skills"}
  claude_agents:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=<lan-ip>,nfsvers=4.2,ro,hard,timeo=50,actimeo=1", device: ":/home/user/.claude/agents"}
  anpitek:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=<lan-ip>,nfsvers=4.2,rw,hard,timeo=50,actimeo=1", device: ":/home/user/anpitek"}
  anpitek_memory:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=<lan-ip>,nfsvers=4.2,rw,hard,timeo=50,actimeo=1", device: ":/home/user/.claude/projects/-home-user-anpitek/memory"}
  trade:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=<lan-ip>,nfsvers=4.2,rw,hard,timeo=50,actimeo=1", device: ":/home/user/trade_bot"}
  trade_memory:
    <<: *nfs
    driver_opts: {type: nfs, o: "addr=<lan-ip>,nfsvers=4.2,rw,hard,timeo=50,actimeo=1", device: ":/home/user/.claude/projects/-home-user-trade-bot/memory"}
